<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Configurar GREÑA CONTEXTO</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#252044,#0a0a12 65%);color:#fff;font:16px system-ui}
main{width:min(560px,92vw);padding:38px;border:1px solid #ffffff20;border-radius:22px;background:#151522;box-shadow:0 25px 80px #0008}
h1{font-size:34px;margin:0 0 10px;font-weight:900}h1 span{color:#a78bfa}p{color:#c7c5d4;line-height:1.55}
input{width:100%;padding:15px;border-radius:12px;border:1px solid #45425a;background:#0b0b14;color:#fff;font-size:16px;margin:12px 0}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#8b5cf6;color:white;font-weight:800;font-size:16px;cursor:pointer}
#msg{min-height:24px;color:#fca5a5;font-size:14px}
small{color:#aaa5bd;display:block;margin-top:18px}
</style></head><body><main>
<h1>GREÑA <span>CONTEXTO</span></h1>
<p>Para jugar online, pega aquí la dirección pública del servidor del juego. Se guarda en este ordenador para las próximas veces.</p>
<form id="form"><input id="url" type="url" placeholder="https://tu-servidor.up.railway.app" required><button>Conectar y jugar</button></form>
<div id="msg"></div><small>¿Todavía no tienes servidor? Primero hay que publicar el proyecto online. Esta aplicación de escritorio se conectará a ese servidor.</small>
<script>
const params=new URLSearchParams(location.search); if(params.get('message')) document.querySelector('#msg').textContent=params.get('message');
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;b.textContent='Conectando…';const r=await window.grenaDesktop.saveServerUrl(document.querySelector('#url').value);if(!r.ok){document.querySelector('#msg').textContent=r.error;b.disabled=false;b.textContent='Conectar y jugar';}});
</script></main></body></html>
