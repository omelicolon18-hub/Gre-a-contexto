name: Construir instalador de Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'package.json'
      - '.github/workflows/windows-exe.yml'
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Crear instalador EXE
        run: npm run dist:win
      - name: Publicar instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GRENA-CONTEXTO-WINDOWS
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
