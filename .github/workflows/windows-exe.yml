name: Construir instalador de Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-exe.yml'
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package.json
      - name: Instalar dependencias del cliente
        run: npm --prefix desktop install --no-audit --no-fund
      - name: Crear instalador EXE
        run: npm --prefix desktop run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: GRENA-CONTEXTO-WINDOWS
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
