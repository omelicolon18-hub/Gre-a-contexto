name: Comprobar proyecto
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --onnxruntime-node-install-cuda=skip
      - run: npm test
      - run: node --check cloudflare/worker.js
      - run: node --check build-vocab.js
